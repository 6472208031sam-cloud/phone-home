# xcodegen project spec — generates PhoneHome.xcodeproj on the CI runner.
# Same shape as the Bus iOS projects: the `info:` block needs BOTH `path:`
# AND `properties:` with every key — xcodegen GENERATES the Info.plist at
# `path` from `properties`; do NOT commit a hand-written Info.plist.
name: PhoneHome
options:
  bundleIdPrefix: io.github
  deploymentTarget:
    iOS: "15.0"
targets:
  PhoneHome:
    type: application
    platform: iOS
    sources:
      - path: PhoneHome/Sources
    info:
      path: PhoneHome/Info.plist
      properties:
        CFBundleDisplayName: Phone Home Spike v3
        CFBundleShortVersionString: "3.0"
        CFBundleVersion: "3"
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Phone Home Spike uses your location to send its hourly check-in."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Phone Home Spike needs background location so its hourly check-in still works when the app is closed."
        UIBackgroundModes: [fetch, location]
        BGTaskSchedulerPermittedIdentifiers: [io.github.phonehome.refresh]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.phonehome
        SWIFT_VERSION: "5.0"
